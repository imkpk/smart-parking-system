name: CI

on:
  pull_request:
    branches: [main, develop, single-tenant]
  push:
    branches: [main, develop, single-tenant]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.grok/**'
      - 'scripts/**'
      - '.github/**'

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secrets-scan:
    name: secrets-scan
    uses: ./.github/workflows/secrets-scan.yml
    secrets: inherit

  changes:
    name: Detect changes
    needs: secrets-scan
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      payment: ${{ steps.filter.outputs.payment }}
      iot-edge: ${{ steps.filter.outputs.iot-edge }}
      iot-integration: ${{ steps.filter.outputs.iot-integration }}
      iot-frontend: ${{ steps.filter.outputs.iot-frontend }}
      workflow: ${{ steps.filter.outputs.workflow }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            payment:
              - 'payment-service/**'
              - 'backend/src/integrations/payment-service/**'
              - 'backend/src/parking-events/**'
              - 'backend/src/iot/**'
            iot-edge:
              - 'iot-edge/**'
            iot-integration:
              - '.github/workflows/ci.yml'
              - 'backend/src/iot/**'
              - 'backend/src/parking-events/**'
              - 'backend/src/integrations/payment-service/**'
              - 'backend/src/events/gate-open-requested.handler.ts'
              - 'backend/test/iot-gate-lifecycle*.ts'
              - 'iot-edge/**'
              - 'scripts/iot-fullstack-integration.mjs'
              - 'docker-compose.iot.yml'
              - 'docker-compose.fullstack-iot.yml'
              - 'infra/mosquitto/**'
            iot-frontend:
              - 'frontend/src/**/*iot*'
              - 'frontend/src/**/*Gate*'
              - 'frontend/cypress/e2e/smoke/j16-iot-gate-entry.cy.ts'
              - 'frontend/cypress/e2e/smoke/j17-iot-gate-denial.cy.ts'
            workflow:
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - 'docs/**'
              - '.grok/**'
              - 'scripts/**'

  backend:
    name: NestJS Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Fetch develop for affected tests
        if: github.event_name == 'pull_request'
        run: git fetch origin develop

      - name: Test affected only (PR)
        if: github.event_name == 'pull_request'
        run: npm run test:affected

      - name: Test with coverage (develop push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: npm run test:cov

      - name: Test with coverage (main/single-tenant push)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/single-tenant')
        run: npm run test:cov

  frontend:
    name: React Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fetch develop for affected tests
        if: github.event_name == 'pull_request'
        run: git fetch origin develop

      - name: Test affected only (PR)
        if: github.event_name == 'pull_request'
        run: npm run test:affected

      - name: Test with coverage (develop push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        id: coverage
        run: npm run coverage

      - name: Test with coverage (main/single-tenant push)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/single-tenant')
        id: coverage-main
        run: npm run coverage

      - name: Frontend coverage summary
        if: github.event_name == 'push' && steps.coverage.outcome == 'success'
        run: node ../.github/scripts/frontend-coverage-summary.mjs

  iot-edge:
    name: IoT Edge Gateway
    needs: changes
    if: needs.changes.outputs.iot-edge == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-edge
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iot-edge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  iot-fullstack-integration:
    name: IoT Full-Stack Integration
    needs: [changes, payment-service]
    if: >
      always() &&
      needs.changes.outputs.iot-integration == 'true' &&
      (needs.payment-service.result == 'success' || needs.payment-service.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: smart_parking_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/smart_parking_db?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/smart_parking_shadow_db?schema=public
      PORT: '3000'
      JWT_SECRET: smart_parking_dev_jwt_secret_32_chars_minimum
      JWT_EXPIRES_IN: 1d
      PAYMENT_SERVICE_URL: http://127.0.0.1:8081
      PAYMENT_SERVICE_JWT_SECRET: dev_payment_service_jwt_secret_32_chars
      PAYMENT_SERVICE_JWT_ISSUER: smart-parking-backend
      PAYMENT_SERVICE_JWT_AUDIENCE: smart-parking-payment-service
      PAYMENT_SERVICE_TOKEN_TTL_SECONDS: 60
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DB_URL: jdbc:postgresql://127.0.0.1:5432/parking_payment_db
      DB_USERNAME: postgres
      DB_PASSWORD: password
      JWT_SECRET_PAYMENT: smart_parking_dev_jwt_secret_32_chars_minimum
      IOT_ENABLED: 'true'
      IOT_IDENTIFIER_PEPPER: demo_iot_pepper_dev_only_not_production
      IOT_DEVICE_CREDENTIAL_PEPPER: demo_iot_pepper_dev_only_not_production
      MQTT_BROKER_URL: mqtt://127.0.0.1:1883
      MQTT_TOPIC_PREFIX: smart-parking
      OUTBOX_WORKER_ENABLED: 'true'
      OUTBOX_WORKER_INTERVAL_MS: 500
      EDGE_URL: http://127.0.0.1:3100
      EDGE_LOCAL_API_KEY: dev-edge-key
      EDGE_DEVICE_CREDENTIAL: demo-device-credential-not-a-real-secret
      EXTERNAL_DEVICE_ID: edge-gw-demo-001
      ORGANIZATION_ID: '1'
      DEMO_RESEED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            iot-edge/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Start Mosquitto
        run: docker compose -f docker-compose.iot.yml up -d mosquitto

      - name: Prepare databases
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=password psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE smart_parking_shadow_db;"
          PGPASSWORD=password psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE parking_payment_db;"

      - name: Install and migrate backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          DEMO_RESEED=1 npm run prisma:demo-seed
          npm run build

      - name: Run mocked IoT orchestration tests
        working-directory: backend
        run: npm run test:iot-orchestration

      - name: Start backend API
        working-directory: backend
        run: |
          npm run start > ../backend-iot.log 2>&1 &
          echo $! > ../backend-iot.pid

      - name: Build and start payment service
        working-directory: payment-service
        run: |
          mvn -B -q package -DskipTests
          JWT_SECRET="${JWT_SECRET_PAYMENT}" \
          DB_URL="${DB_URL}" \
          DB_USERNAME="${DB_USERNAME}" \
          DB_PASSWORD="${DB_PASSWORD}" \
          java -jar target/*.jar > ../payment-iot.log 2>&1 &
          echo $! > ../payment-iot.pid

      - name: Build and start IoT edge gateway
        working-directory: iot-edge
        run: |
          npm ci
          npm run build
          EDGE_LOCAL_API_KEY="${EDGE_LOCAL_API_KEY}" \
          EDGE_DEVICE_CREDENTIAL="${EDGE_DEVICE_CREDENTIAL}" \
          EXTERNAL_DEVICE_ID="${EXTERNAL_DEVICE_ID}" \
          ORGANIZATION_ID="${ORGANIZATION_ID}" \
          MQTT_BROKER_URL="${MQTT_BROKER_URL}" \
          MQTT_TOPIC_PREFIX="${MQTT_TOPIC_PREFIX}" \
          BARRIER_MODE=SIMULATED \
          SIMULATED_BARRIER_DELAY_MS=50 \
          npm run start > ../iot-edge.log 2>&1 &
          echo $! > ../iot-edge.pid

      - name: Wait for backend, payment service, edge, and Mosquitto
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null \
              && curl -sf http://127.0.0.1:8081/actuator/health >/dev/null \
              && curl -sf http://127.0.0.1:3100/health >/dev/null \
              && docker exec smart-parking-mosquitto mosquitto_sub -h 127.0.0.1 -t '$SYS/broker/version' -C 1 -W 2 >/dev/null; then
              echo "IoT stack ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend log:" && tail -n 80 backend-iot.log || true
          echo "Payment log:" && tail -n 80 payment-iot.log || true
          echo "IoT edge log:" && tail -n 80 iot-edge.log || true
          exit 1

      - name: Run IoT full-stack integration harness
        working-directory: backend
        run: npm run test:iot-fullstack

  payment-service:
    name: Spring Boot Payment Service
    needs: changes
    if: >
      needs.changes.outputs.payment == 'true' ||
      needs.changes.outputs.iot-integration == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Fetch develop for affected tests
        if: github.event_name == 'pull_request'
        run: git fetch origin develop

      - name: Build (PR — skip tests)
        if: github.event_name == 'pull_request'
        run: mvn -B clean package -DskipTests

      - name: Test affected only (PR)
        if: github.event_name == 'pull_request'
        run: node ../scripts/ci-payment-affected-tests.mjs

      - name: Build and test (develop push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: mvn -B clean package

      - name: Build and test (main/single-tenant push)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/single-tenant')
        run: mvn -B clean package

  e2e-smoke:
    name: Cypress E2E Smoke
    needs: changes
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      (
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.backend == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: smart_parking_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/smart_parking_db?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/smart_parking_shadow_db?schema=public
      PORT: '3000'
      JWT_SECRET: smart_parking_dev_jwt_secret_32_chars_minimum
      JWT_EXPIRES_IN: 1d
      PAYMENT_SERVICE_URL: http://127.0.0.1:8081
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DB_URL: jdbc:postgresql://postgres:password@127.0.0.1:5432/parking_payment_db
      DB_USERNAME: postgres
      DB_PASSWORD: password
      JWT_SECRET_PAYMENT: smart_parking_dev_jwt_secret_32_chars_minimum
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Prepare databases
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=password psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE smart_parking_shadow_db;"
          PGPASSWORD=password psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE parking_payment_db;"

      - name: Install and migrate backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run prisma:seed
          npm run build

      - name: Start backend API
        working-directory: backend
        run: |
          npm run start > ../backend-e2e.log 2>&1 &
          echo $! > ../backend-e2e.pid

      - name: Build and start payment service
        working-directory: payment-service
        run: |
          mvn -B -q package -DskipTests
          JWT_SECRET="${JWT_SECRET_PAYMENT}" \
          DB_URL="${DB_URL}" \
          DB_USERNAME="${DB_USERNAME}" \
          DB_PASSWORD="${DB_PASSWORD}" \
          java -jar target/*.jar > ../payment-e2e.log 2>&1 &
          echo $! > ../payment-e2e.pid

      - name: Wait for backend and payment service
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null && curl -sf http://127.0.0.1:8081/actuator/health >/dev/null; then
              echo "Services ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend log:"
          tail -n 80 backend-e2e.log || true
          echo "Payment log:"
          tail -n 80 payment-e2e.log || true
          exit 1

      - name: Install frontend and run Cypress smoke
        working-directory: frontend
        env:
          CYPRESS_SCREENSHOT_ON_RUN_FAILURE: 'false'
        run: |
          npm ci
          npx cypress verify
          npm run e2e:ci

  iot-cypress-smoke:
    name: IoT Cypress UI Smoke
    needs: changes
    if: >
      github.event_name == 'pull_request' &&
      needs.changes.outputs.iot-frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend and run IoT Cypress smoke (J16/J17)
        env:
          CYPRESS_SCREENSHOT_ON_RUN_FAILURE: 'false'
        run: |
          npm ci
          npx cypress verify
          npx start-server-and-test dev http://localhost:5173 \
            "cypress run --spec cypress/e2e/smoke/j16-iot-gate-entry.cy.ts,cypress/e2e/smoke/j17-iot-gate-denial.cy.ts"

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend, payment-service, iot-edge, iot-fullstack-integration, iot-cypress-smoke, e2e-smoke]
    if: always()
    steps:
      - name: Verify CI results
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Gate mode: path-filtered PR checks (build + affected tests; IoT Cypress smoke on iot-frontend paths)"
          else
            echo "Gate mode: full integration trunk checks on develop push (coverage + Cypress smoke on relevant paths)"
          fi
          echo "Backend: ${{ needs.backend.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Payment: ${{ needs.payment-service.result }}"
          echo "IoT Edge: ${{ needs.iot-edge.result }}"
          echo "IoT Full-Stack Integration: ${{ needs.iot-fullstack-integration.result }}"
          echo "IoT Cypress Smoke (PR iot-frontend paths): ${{ needs.iot-cypress-smoke.result }}"
          echo "E2E Smoke (advisory on push only): ${{ needs.e2e-smoke.result }}"

          failed=0
          if [ "${{ needs.backend.result }}" = "failure" ] || [ "${{ needs.backend.result }}" = "cancelled" ]; then
            echo "Backend job failed or was cancelled"
            failed=1
          fi
          if [ "${{ needs.frontend.result }}" = "failure" ] || [ "${{ needs.frontend.result }}" = "cancelled" ]; then
            echo "Frontend job failed or was cancelled"
            failed=1
          fi
          if [ "${{ needs.payment-service.result }}" = "failure" ] || [ "${{ needs.payment-service.result }}" = "cancelled" ]; then
            echo "Payment service job failed or was cancelled"
            failed=1
          fi
          if [ "${{ needs.iot-edge.result }}" = "failure" ] || [ "${{ needs.iot-edge.result }}" = "cancelled" ]; then
            echo "IoT edge job failed or was cancelled"
            failed=1
          fi
          if [ "${{ needs.iot-fullstack-integration.result }}" = "failure" ] || [ "${{ needs.iot-fullstack-integration.result }}" = "cancelled" ]; then
            echo "IoT full-stack integration job failed or was cancelled"
            failed=1
          fi
          if [ "${{ needs.iot-cypress-smoke.result }}" = "failure" ] || [ "${{ needs.iot-cypress-smoke.result }}" = "cancelled" ]; then
            echo "IoT Cypress smoke job failed or was cancelled"
            failed=1
          fi

          if [ "$failed" -eq 1 ]; then
            exit 1
          fi

          echo "CI passed (skipped service jobs are OK)"