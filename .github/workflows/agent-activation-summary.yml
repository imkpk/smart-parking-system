name: Agent Activation Summary

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install orchestration deps
        working-directory: scripts/agents
        run: npm ci

      - name: Validate manifest
        run: node scripts/agents/validate-manifest.mjs

      - name: Plan activation (canonical planner)
        id: plan
        run: |
          git fetch origin develop
          node scripts/agents/plan-run.mjs \
            --base origin/develop \
            --head HEAD \
            --format comment > /tmp/activation-comment.md
          node scripts/agents/plan-run.mjs \
            --base origin/develop \
            --head HEAD \
            --format json > /tmp/activation-plan.json
          echo "Planner output written"

      - name: Upsert single PR activation comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- smart-parking-agent-activation -->';
            const body = fs.readFileSync('/tmp/activation-comment.md', 'utf8');
            if (!body.includes(marker)) {
              core.setFailed('Activation comment missing stable marker');
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('Created activation comment');
            }

      - name: Write job summary
        run: |
          {
            echo '## Agent activation (canonical planner)'
            echo ''
            cat /tmp/activation-comment.md
          } >> "$GITHUB_STEP_SUMMARY"
