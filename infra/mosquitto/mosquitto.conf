# Local development Mosquitto broker for Smart Parking IoT edge testing.
# Password authentication is optional — see infra/mosquitto/README.md.

listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# WebSocket listener (optional MQTT over WS clients)
listener 9001
protocol websockets
allow_anonymous true